# CI: тесты, линтеры и проверка Docker-образа.
# Запускается на PR и push в develop; для main вызывается из deploy.yml перед деплоем.

name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q

      # Пока код не вычищен под ruff и mypy, их ошибки не блокируют деплой.
      - name: Ruff
        continue-on-error: true
        run: python -m ruff check src tests

      - name: Mypy
        continue-on-error: true
        run: python -m mypy src/okx_hft --ignore-missing-imports

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t okx-hft-collector:ci .

      - name: Smoke test (imports, no network)
        run: docker run --rm okx-hft-collector:ci python -c "import okx_hft.run"
